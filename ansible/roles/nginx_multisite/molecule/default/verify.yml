---
- name: Verify
  hosts: all
  gather_facts: true
  tasks:
    # ============================================================
    # 1. Verify nginx configuration files exist and have correct content
    # ============================================================
    - name: Verify nginx.conf exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/nginx/nginx.conf
      register: nginx_conf_stat
      tags:
        - verify

    - name: Assert nginx.conf exists
      ansible.builtin.assert:
        that:
          - nginx_conf_stat.stat.exists
        fail_msg: "nginx.conf does not exist"
        success_msg: "nginx.conf exists"
      tags:
        - verify

    - name: Verify nginx.conf contains expected directives
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/nginx/nginx.conf
      register: nginx_conf_content
      tags:
        - verify

    - name: Assert nginx.conf has correct worker_processes
      ansible.builtin.assert:
        that:
          - "'worker_processes auto' in (nginx_conf_content.content | b64decode)"
        fail_msg: "nginx.conf does not contain 'worker_processes auto'"
        success_msg: "nginx.conf has correct worker_processes"
      tags:
        - verify

    - name: Assert nginx.conf has correct worker_connections
      ansible.builtin.assert:
        that:
          - "'worker_connections 768' in (nginx_conf_content.content | b64decode)"
        fail_msg: "nginx.conf does not contain 'worker_connections 768'"
        success_msg: "nginx.conf has correct worker_connections"
      tags:
        - verify

    - name: Assert nginx.conf has correct keepalive_timeout
      ansible.builtin.assert:
        that:
          - "'keepalive_timeout 65' in (nginx_conf_content.content | b64decode)"
        fail_msg: "nginx.conf does not contain 'keepalive_timeout 65'"
        success_msg: "nginx.conf has correct keepalive_timeout"
      tags:
        - verify

    - name: Assert nginx.conf includes sites-enabled
      ansible.builtin.assert:
        that:
          - "'include /etc/nginx/sites-enabled/*' in (nginx_conf_content.content | b64decode)"
        fail_msg: "nginx.conf does not include sites-enabled"
        success_msg: "nginx.conf includes sites-enabled"
      tags:
        - verify

    # ============================================================
    # 2. Verify security.conf exists and has correct content
    # ============================================================
    - name: Verify security.conf exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/nginx/conf.d/security.conf
      register: security_conf_stat
      tags:
        - verify

    - name: Assert security.conf exists
      ansible.builtin.assert:
        that:
          - security_conf_stat.stat.exists
        fail_msg: "security.conf does not exist"
        success_msg: "security.conf exists"
      tags:
        - verify

    - name: Verify security.conf content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/nginx/conf.d/security.conf
      register: security_conf_content
      tags:
        - verify

    - name: Assert security.conf has server_tokens off
      ansible.builtin.assert:
        that:
          - "'server_tokens off' in (security_conf_content.content | b64decode)"
        fail_msg: "security.conf does not have server_tokens off"
        success_msg: "security.conf has server_tokens off"
      tags:
        - verify

    - name: Assert security.conf has correct SSL protocols
      ansible.builtin.assert:
        that:
          - "'ssl_protocols TLSv1.2 TLSv1.3' in (security_conf_content.content | b64decode)"
        fail_msg: "security.conf does not have correct SSL protocols"
        success_msg: "security.conf has correct SSL protocols"
      tags:
        - verify

    - name: Assert security.conf has ssl_prefer_server_ciphers on
      ansible.builtin.assert:
        that:
          - "'ssl_prefer_server_ciphers on' in (security_conf_content.content | b64decode)"
        fail_msg: "security.conf does not have ssl_prefer_server_ciphers on"
        success_msg: "security.conf has ssl_prefer_server_ciphers on"
      tags:
        - verify

    - name: Assert security.conf has rate limiting zones
      ansible.builtin.assert:
        that:
          - "'limit_req_zone' in (security_conf_content.content | b64decode)"
        fail_msg: "security.conf does not have rate limiting zones"
        success_msg: "security.conf has rate limiting zones"
      tags:
        - verify

    # ============================================================
    # 3. Verify site configurations exist and have correct content
    # ============================================================
    - name: Verify test.cluster.local site config exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/nginx/sites-available/test.cluster.local
      register: test_site_stat
      tags:
        - verify

    - name: Assert test.cluster.local site config exists
      ansible.builtin.assert:
        that:
          - test_site_stat.stat.exists
        fail_msg: "test.cluster.local site config does not exist"
        success_msg: "test.cluster.local site config exists"
      tags:
        - verify

    - name: Verify test.cluster.local site config content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/nginx/sites-available/test.cluster.local
      register: test_site_content
      tags:
        - verify

    - name: Assert test.cluster.local has correct server_name
      ansible.builtin.assert:
        that:
          - "'server_name test.cluster.local' in (test_site_content.content | b64decode)"
        fail_msg: "test.cluster.local site config has incorrect server_name"
        success_msg: "test.cluster.local has correct server_name"
      tags:
        - verify

    - name: Assert test.cluster.local has correct document_root
      ansible.builtin.assert:
        that:
          - "'root /opt/server/test' in (test_site_content.content | b64decode)"
        fail_msg: "test.cluster.local site config has incorrect document_root"
        success_msg: "test.cluster.local has correct document_root"
      tags:
        - verify

    - name: Assert test.cluster.local has SSL certificate path
      ansible.builtin.assert:
        that:
          - "'ssl_certificate /etc/ssl/certs/test.cluster.local.crt' in (test_site_content.content | b64decode)"
        fail_msg: "test.cluster.local site config has incorrect SSL certificate path"
        success_msg: "test.cluster.local has correct SSL certificate path"
      tags:
        - verify

    - name: Assert test.cluster.local has SSL key path
      ansible.builtin.assert:
        that:
          - "'ssl_certificate_key /etc/ssl/private/test.cluster.local.key' in (test_site_content.content | b64decode)"
        fail_msg: "test.cluster.local site config has incorrect SSL key path"
        success_msg: "test.cluster.local has correct SSL key path"
      tags:
        - verify

    - name: Assert test.cluster.local has HSTS header
      ansible.builtin.assert:
        that:
          - "'Strict-Transport-Security' in (test_site_content.content | b64decode)"
        fail_msg: "test.cluster.local site config does not have HSTS header"
        success_msg: "test.cluster.local has HSTS header"
      tags:
        - verify

    - name: Assert test.cluster.local has security headers
      ansible.builtin.assert:
        that:
          - "'X-Frame-Options DENY' in (test_site_content.content | b64decode)"
          - "'X-Content-Type-Options nosniff' in (test_site_content.content | b64decode)"
          - "'X-XSS-Protection' in (test_site_content.content | b64decode)"
          - "'Referrer-Policy' in (test_site_content.content | b64decode)"
          - "'Content-Security-Policy' in (test_site_content.content | b64decode)"
        fail_msg: "test.cluster.local site config is missing security headers"
        success_msg: "test.cluster.local has all security headers"
      tags:
        - verify

    - name: Assert test.cluster.local has gzip enabled
      ansible.builtin.assert:
        that:
          - "'gzip on' in (test_site_content.content | b64decode)"
        fail_msg: "test.cluster.local site config does not have gzip enabled"
        success_msg: "test.cluster.local has gzip enabled"
      tags:
        - verify

    - name: Assert test.cluster.local has try_files directive
      ansible.builtin.assert:
        that:
          - "'try_files $uri $uri/ =404' in (test_site_content.content | b64decode)"
        fail_msg: "test.cluster.local site config does not have try_files directive"
        success_msg: "test.cluster.local has try_files directive"
      tags:
        - verify

    - name: Assert test.cluster.local has .ht access denied
      ansible.builtin.assert:
        that:
          - "'deny all' in (test_site_content.content | b64decode)"
        fail_msg: "test.cluster.local site config does not deny .ht access"
        success_msg: "test.cluster.local denies .ht access"
      tags:
        - verify

    - name: Assert test.cluster.local has git/svn access denied
      ansible.builtin.assert:
        that:
          - "'deny all' in (test_site_content.content | b64decode)"
        fail_msg: "test.cluster.local site config does not deny git/svn access"
        success_msg: "test.cluster.local denies git/svn access"
      tags:
        - verify

    - name: Assert test.cluster.local has correct access log path
      ansible.builtin.assert:
        that:
          - "'access_log /var/log/nginx/test.cluster.local_access.log' in (test_site_content.content | b64decode)"
        fail_msg: "test.cluster.local site config has incorrect access log path"
        success_msg: "test.cluster.local has correct access log path"
      tags:
        - verify

    - name: Assert test.cluster.local has correct error log path
      ansible.builtin.assert:
        that:
          - "'error_log /var/log/nginx/test.cluster.local_error.log' in (test_site_content.content | b64decode)"
        fail_msg: "test.cluster.local site config has incorrect error log path"
        success_msg: "test.cluster.local has correct error log path"
      tags:
        - verify

    # ============================================================
    # 4. Verify ci.cluster.local site configuration
    # ============================================================
    - name: Verify ci.cluster.local site config exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/nginx/sites-available/ci.cluster.local
      register: ci_site_stat
      tags:
        - verify

    - name: Assert ci.cluster.local site config exists
      ansible.builtin.assert:
        that:
          - ci_site_stat.stat.exists
        fail_msg: "ci.cluster.local site config does not exist"
        success_msg: "ci.cluster.local site config exists"
      tags:
        - verify

    - name: Verify ci.cluster.local site config content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/nginx/sites-available/ci.cluster.local
      register: ci_site_content
      tags:
        - verify

    - name: Assert ci.cluster.local has correct server_name
      ansible.builtin.assert:
        that:
          - "'server_name ci.cluster.local' in (ci_site_content.content | b64decode)"
        fail_msg: "ci.cluster.local site config has incorrect server_name"
        success_msg: "ci.cluster.local has correct server_name"
      tags:
        - verify

    - name: Assert ci.cluster.local has correct document_root
      ansible.builtin.assert:
        that:
          - "'root /opt/server/ci' in (ci_site_content.content | b64decode)"
        fail_msg: "ci.cluster.local site config has incorrect document_root"
        success_msg: "ci.cluster.local has correct document_root"
      tags:
        - verify

    - name: Assert ci.cluster.local has SSL certificate path
      ansible.builtin.assert:
        that:
          - "'ssl_certificate /etc/ssl/certs/ci.cluster.local.crt' in (ci_site_content.content | b64decode)"
        fail_msg: "ci.cluster.local site config has incorrect SSL certificate path"
        success_msg: "ci.cluster.local has correct SSL certificate path"
      tags:
        - verify

    - name: Assert ci.cluster.local has SSL key path
      ansible.builtin.assert:
        that:
          - "'ssl_certificate_key /etc/ssl/private/ci.cluster.local.key' in (ci_site_content.content | b64decode)"
        fail_msg: "ci.cluster.local site config has incorrect SSL key path"
        success_msg: "ci.cluster.local has correct SSL key path"
      tags:
        - verify

    - name: Assert ci.cluster.local has HSTS header
      ansible.builtin.assert:
        that:
          - "'Strict-Transport-Security' in (ci_site_content.content | b64decode)"
        fail_msg: "ci.cluster.local site config does not have HSTS header"
        success_msg: "ci.cluster.local has HSTS header"
      tags:
        - verify

    - name: Assert ci.cluster.local has security headers
      ansible.builtin.assert:
        that:
          - "'X-Frame-Options DENY' in (ci_site_content.content | b64decode)"
          - "'X-Content-Type-Options nosniff' in (ci_site_content.content | b64decode)"
          - "'X-XSS-Protection' in (ci_site_content.content | b64decode)"
          - "'Referrer-Policy' in (ci_site_content.content | b64decode)"
          - "'Content-Security-Policy' in (ci_site_content.content | b64decode)"
        fail_msg: "ci.cluster.local site config is missing security headers"
        success_msg: "ci.cluster.local has all security headers"
      tags:
        - verify

    - name: Assert ci.cluster.local has gzip enabled
      ansible.builtin.assert:
        that:
          - "'gzip on' in (ci_site_content.content | b64decode)"
        fail_msg: "ci.cluster.local site config does not have gzip enabled"
        success_msg: "ci.cluster.local has gzip enabled"
      tags:
        - verify

    - name: Assert ci.cluster.local has try_files directive
      ansible.builtin.assert:
        that:
          - "'try_files $uri $uri/ =404' in (ci_site_content.content | b64decode)"
        fail_msg: "ci.cluster.local site config does not have try_files directive"
        success_msg: "ci.cluster.local has try_files directive"
      tags:
        - verify

    - name: Assert ci.cluster.local has correct access log path
      ansible.builtin.assert:
        that:
          - "'access_log /var/log/nginx/ci.cluster.local_access.log' in (ci_site_content.content | b64decode)"
        fail_msg: "ci.cluster.local site config has incorrect access log path"
        success_msg: "ci.cluster.local has correct access log path"
      tags:
        - verify

    - name: Assert ci.cluster.local has correct error log path
      ansible.builtin.assert:
        that:
          - "'error_log /var/log/nginx/ci.cluster.local_error.log' in (ci_site_content.content | b64decode)"
        fail_msg: "ci.cluster.local site config has incorrect error log path"
        success_msg: "ci.cluster.local has correct error log path"
      tags:
        - verify

    # ============================================================
    # 5. Verify status.cluster.local site configuration
    # ============================================================
    - name: Verify status.cluster.local site config exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/nginx/sites-available/status.cluster.local
      register: status_site_stat
      tags:
        - verify

    - name: Assert status.cluster.local site config exists
      ansible.builtin.assert:
        that:
          - status_site_stat.stat.exists
        fail_msg: "status.cluster.local site config does not exist"
        success_msg: "status.cluster.local site config exists"
      tags:
        - verify

    - name: Verify status.cluster.local site config content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/nginx/sites-available/status.cluster.local
      register: status_site_content
      tags:
        - verify

    - name: Assert status.cluster.local has correct server_name
      ansible.builtin.assert:
        that:
          - "'server_name status.cluster.local' in (status_site_content.content | b64decode)"
        fail_msg: "status.cluster.local site config has incorrect server_name"
        success_msg: "status.cluster.local has correct server_name"
      tags:
        - verify

    - name: Assert status.cluster.local has correct document_root
      ansible.builtin.assert:
        that:
          - "'root /opt/server/status' in (status_site_content.content | b64decode)"
        fail_msg: "status.cluster.local site config has incorrect document_root"
        success_msg: "status.cluster.local has correct document_root"
      tags:
        - verify

    - name: Assert status.cluster.local has SSL certificate path
      ansible.builtin.assert:
        that:
          - "'ssl_certificate /etc/ssl/certs/status.cluster.local.crt' in (status_site_content.content | b64decode)"
        fail_msg: "status.cluster.local site config has incorrect SSL certificate path"
        success_msg: "status.cluster.local has correct SSL certificate path"
      tags:
        - verify

    - name: Assert status.cluster.local has SSL key path
      ansible.builtin.assert:
        that:
          - "'ssl_certificate_key /etc/ssl/private/status.cluster.local.key' in (status_site_content.content | b64decode)"
        fail_msg: "status.cluster.local site config has incorrect SSL key path"
        success_msg: "status.cluster.local has correct SSL key path"
      tags:
        - verify

    - name: Assert status.cluster.local has HSTS header
      ansible.builtin.assert:
        that:
          - "'Strict-Transport-Security' in (status_site_content.content | b64decode)"
        fail_msg: "status.cluster.local site config does not have HSTS header"
        success_msg: "status.cluster.local has HSTS header"
      tags:
        - verify

    - name: Assert status.cluster.local has security headers
      ansible.builtin.assert:
        that:
          - "'X-Frame-Options DENY' in (status_site_content.content | b64decode)"
          - "'X-Content-Type-Options nosniff' in (status_site_content.content | b64decode)"
          - "'X-XSS-Protection' in (status_site_content.content | b64decode)"
          - "'Referrer-Policy' in (status_site_content.content | b64decode)"
          - "'Content-Security-Policy' in (status_site_content.content | b64decode)"
        fail_msg: "status.cluster.local site config is missing security headers"
        success_msg: "status.cluster.local has all security headers"
      tags:
        - verify

    - name: Assert status.cluster.local has gzip enabled
      ansible.builtin.assert:
        that:
          - "'gzip on' in (status_site_content.content | b64decode)"
        fail_msg: "status.cluster.local site config does not have gzip enabled"
        success_msg: "status.cluster.local has gzip enabled"
      tags:
        - verify

    - name: Assert status.cluster.local has try_files directive
      ansible.builtin.assert:
        that:
          - "'try_files $uri $uri/ =404' in (status_site_content.content | b64decode)"
        fail_msg: "status.cluster.local site config does not have try_files directive"
        success_msg: "status.cluster.local has try_files directive"
      tags:
        - verify

    - name: Assert status.cluster.local has correct access log path
      ansible.builtin.assert:
        that:
          - "'access_log /var/log/nginx/status.cluster.local_access.log' in (status_site_content.content | b64decode)"
        fail_msg: "status.cluster.local site config has incorrect access log path"
        success_msg: "status.cluster.local has correct access log path"
      tags:
        - verify

    - name: Assert status.cluster.local has correct error log path
      ansible.builtin.assert:
        that:
          - "'error_log /var/log/nginx/status.cluster.local_error.log' in (status_site_content.content | b64decode)"
        fail_msg: "status.cluster.local site config has incorrect error log path"
        success_msg: "status.cluster.local has correct error log path"
      tags:
        - verify

    # ============================================================
    # 6. Verify symlinks in sites-enabled
    # ============================================================
    - name: Verify test.cluster.local symlink exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/nginx/sites-enabled/test.cluster.local
      register: test_symlink_stat
      tags:
        - verify

    - name: Assert test.cluster.local symlink exists and is a link
      ansible.builtin.assert:
        that:
          - test_symlink_stat.stat.exists
          - test_symlink_stat.stat.islnk
        fail_msg: "test.cluster.local symlink does not exist or is not a link"
        success_msg: "test.cluster.local symlink exists and is a link"
      tags:
        - verify

    - name: Verify ci.cluster.local symlink exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/nginx/sites-enabled/ci.cluster.local
      register: ci_symlink_stat
      tags:
        - verify

    - name: Assert ci.cluster.local symlink exists and is a link
      ansible.builtin.assert:
        that:
          - ci_symlink_stat.stat.exists
          - ci_symlink_stat.stat.islnk
        fail_msg: "ci.cluster.local symlink does not exist or is not a link"
        success_msg: "ci.cluster.local symlink exists and is a link"
      tags:
        - verify

    - name: Verify status.cluster.local symlink exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/nginx/sites-enabled/status.cluster.local
      register: status_symlink_stat
      tags:
        - verify

    - name: Assert status.cluster.local symlink exists and is a link
      ansible.builtin.assert:
        that:
          - status_symlink_stat.stat.exists
          - status_symlink_stat.stat.islnk
        fail_msg: "status.cluster.local symlink does not exist or is not a link"
        success_msg: "status.cluster.local symlink exists and is a link"
      tags:
        - verify

    # ============================================================
    # 7. Verify default site is removed
    # ============================================================
    - name: Verify default site does not exist
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/nginx/sites-enabled/default
      register: default_site_stat
      tags:
        - verify

    - name: Assert default site does not exist
      ansible.builtin.assert:
        that:
          - not default_site_stat.stat.exists
        fail_msg: "default site still exists in sites-enabled"
        success_msg: "default site has been removed"
      tags:
        - verify

    # ============================================================
    # 8. Verify fail2ban configuration
    # ============================================================
    - name: Verify fail2ban jail.local exists
      ansible.builtin.stat:
        path: /tmp/molecule_test/etc/fail2ban/jail.local
      register: fail2ban_jail_stat
      tags:
        - verify

    - name: Assert fail2ban jail.local exists
      ansible.builtin.assert:
        that:
          - fail2ban_jail_stat.stat.exists
        fail_msg: "fail2ban jail.local does not exist"
        success_msg: "fail2ban jail.local exists"
      tags:
        - verify

    - name: Verify fail2ban jail.local content
      ansible.builtin.slurp:
        src: /tmp/molecule_test/etc/fail2ban/jail.local
      register: fail2ban_jail_content
      tags:
        - verify

    - name: Assert fail2ban has correct bantime
      ansible.builtin.assert:
        that:
          - "'bantime = 3600' in (fail2ban_jail_content.content | b64decode)"
        fail_msg: "fail2ban jail.local does not have correct bantime"
        success_msg: "fail2ban has correct bantime"
      tags:
        - verify

    - name: Assert fail2ban has correct findtime
      ansible.builtin.assert:
        that:
          - "'findtime = 600' in (fail2ban_jail_content.content | b64decode)"
        fail_msg: "fail2ban jail.local does not have correct findtime"
        success_msg: "fail2ban has correct findtime"
      tags:
        - verify

    - name: Assert fail2ban has correct maxretry
      ansible.builtin.assert:
        that:
          - "'maxretry = 3' in (fail2ban_jail_content.content | b64decode)"
        fail_msg: "fail2ban jail.local does not have correct maxretry"
        success_msg: "fail2ban has correct maxretry"
      tags:
        - verify

    - name: Assert fail2ban has sshd jail enabled
      ansible.builtin.assert:
        that:
          - "'[sshd]' in (fail2ban_jail_content.content | b64decode)"
          - "'enabled = true' in (fail2ban_jail_content.content | b64decode)"
        fail_msg: "fail2ban sshd jail is not enabled"
        success_msg: "fail2ban sshd jail is enabled"
      tags:
        - verify

    - name: Assert fail2ban has nginx-http-auth jail enabled
      ansible.builtin.assert:
        that:
          - "'[nginx-http-auth]' in (fail2ban_jail_content.content | b64decode)"
          - "'enabled = true' in (fail2ban_jail_content.content | b64decode)"
        fail_msg: "fail2ban nginx-http-auth jail is not enabled"
        success_msg: "fail2ban nginx-http-auth jail is enabled"
      tags:
        - verify

    - name: Assert fail2ban has nginx-limit-req jail enabled
      ansible.builtin.assert:
        that:
          - "'[nginx-limit-req]' in (fail2ban_jail_content.content | b64decode)"
          - "'enabled = true' in (fail2ban_jail_content.content | b64decode)"
        fail_msg: "fail2ban nginx-limit-req jail is not enabled"
        success_msg: "fail2ban nginx-limit-req jail is enabled"
      tags:
        - verify

    - name: Assert fail2ban has nginx-botsearch jail enabled
      ansible.builtin.assert:
        that:
          - "'[nginx-botsearch]' in (fail2ban_jail_content.content | b64decode)"
          - "'enabled = true' in (fail2ban_jail_content.content | b64decode)"
        fail_msg: "fail2ban nginx-botsearch jail is not enabled"
        success_msg: "fail2ban nginx-botsearch jail is enabled"
      tags:
        - verify

    # ============================================================
    # 9. Verify sysctl security configuration
    # ============================================================
    - name: Verify sysctl security.conf exists
      ansible.builtin.stat:
