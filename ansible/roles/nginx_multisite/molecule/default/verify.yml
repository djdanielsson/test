        success_msg: "HTTPS access for status.cluster.local is working"
      when: https_status is not failed
      tags:
        - molecule-notest

    # ============================================================
    # 22. Verify UFW configuration (container-safe)
    # ============================================================
    - name: Check UFW status
      ansible.builtin.command:
        cmd: ufw status
      register: ufw_status
      changed_when: false
      tags:
        - molecule-notest

    - name: Assert UFW is active
      ansible.builtin.assert:
        that:
          - "'Status: active' in ufw_status.stdout"
        fail_msg: "UFW is not active"
        success_msg: "UFW is active"
      tags:
        - molecule-notest

    - name: Verify UFW allows SSH
      ansible.builtin.assert:
        that:
          - "'22/tcp' in ufw_status.stdout"
        fail_msg: "UFW does not allow SSH"
        success_msg: "UFW allows SSH"
      tags:
        - molecule-notest

    - name: Verify UFW allows HTTP
      ansible.builtin.assert:
        that:
          - '80/tcp' in ufw_status.stdout
        fail_msg: "UFW does not allow HTTP"
        success_msg: "UFW allows HTTP"
      tags:
        - molecule-notest

    - name: Verify UFW allows HTTPS
      ansible.builtin.assert:
        that:
          - '443/tcp' in ufw_status.stdout
        fail_msg: "UFW does not allow HTTPS"
        success_msg: "UFW allows HTTPS"
      tags:
        - molecule-notest
