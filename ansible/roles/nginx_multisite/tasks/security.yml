---
- name: sub | Install fail2ban packages
  ansible.builtin.package:
    name: "{{ fail2ban_packages[ansible_facts['os_family']] }}"
    state: present
  when: ansible_facts['os_family'] in fail2ban_packages
- name: sub | Deploy fail2ban jail configuration
  ansible.builtin.template:
    src: fail2ban.jail.local.j2
    dest: /etc/fail2ban/jail.local
    mode: "0640"
    owner: root
    group: root
  notify: restart fail2ban
- name: Enable and start fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true

- name: sub | Install UFW
  ansible.builtin.package:
    name: ufw
    state: present
- name: sub | Set UFW default policy incoming deny
  ansible.builtin.command:
    cmd: ufw default deny incoming
  when: ufw_enabled | bool
  register: result
  changed_when: "'Altered' in result['stdout'] or 'set' in result['stdout']" # noqa: L039
- name: sub | Set UFW default policy outgoing allow
  ansible.builtin.command:
    cmd: ufw default allow outgoing
  when: ufw_enabled | bool
  changed_when: "'Altered' in result['stdout'] or 'set' in result['stdout']"
  register: result
- name: sub | Allow SSH through UFW
  ansible.builtin.command:
    cmd: ufw allow ssh
  when: ufw_enabled | bool
  register: result
  changed_when: "'Altered' in result['stdout'] or 'set' in result['stdout']" # noqa: L039
- name: sub | Allow HTTP through UFW
  ansible.builtin.command:
    cmd: ufw allow http
  when: ufw_enabled | bool
  changed_when: "'Altered' in result['stdout'] or 'set' in result['stdout']"
  register: result
- name: sub | Allow HTTPS through UFW
  ansible.builtin.command:
    cmd: ufw allow https
  when: ufw_enabled | bool
  register: result
  changed_when: "'Altered' in result['stdout'] or 'set' in result['stdout']" # noqa: L039
- name: sub | Enable UFW
  ansible.builtin.command:
    cmd: ufw --force enable
  when: ufw_enabled | bool
  changed_when: "'Altered' in result.stdout or 'set' in result.stdout"
  register: result
- name: sub | Deploy sysctl security configuration
  ansible.builtin.template:
    src: sysctl-security.conf.j2
    dest: /etc/sysctl.d/99-security.conf
    mode: "0600"
    owner: root
    group: root
- name: sub | Apply sysctl settings
  ansible.builtin.command:
    cmd: sysctl -p /etc/sysctl.d/99-security.conf
  when: ansible_facts['os_family'] == 'Debian'
  changed_when: true
